<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Localização — MediLink Digital</title>
    
    <link rel="shortcut icon" href="../../assets/img/logo1.png" type="image/png">
    <link rel="stylesheet" href="../../assets/Bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/fontawesome/all.min.css">
    <link rel="stylesheet" href="../../assets/css/1241308.css">
</head>
<body class="bg-light">

    <div class="d-flex vh-100">
        
        <div class="bg-white p-3 d-flex flex-column border-end" style="width: 260px; min-width: 260px;">
            <a href="../dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none justify-content-center mt-2">
                <img src="../../assets/img/logo.png" alt="MediLink Digital" style="max-height: 45px;">
            </a>
            
            <ul class="nav nav-pills flex-column mb-auto gap-2 mt-3">
                <li class="nav-item">
                    <a href="../dashboard.html" class="nav-link text-dark fw-medium px-3">
                        Visão Geral
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../equipamentos/lista.html" class="nav-link text-dark fw-medium px-3">
                        Equipamentos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="lista.html" class="nav-link active fw-semibold shadow-sm px-3" aria-current="page">
                        Localizações
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../manutencoes/lista.html" class="nav-link text-dark fw-medium px-3">
                        Manutenção
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../fornecedores/lista.html" class="nav-link text-dark fw-medium px-3">
                        Fornecedores
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../documentacao/lista.html" class="nav-link text-dark fw-medium px-3">
                        Documentação e Contratos
                    </a>
                </li>
            </ul>
            <hr class="text-muted mt-4">
            <div>
                <a href="../../public/index.html" class="btn btn-outline-primary w-100 fw-bold">
                    Sair do Sistema
                </a>
            </div>
        </div>

        <div class="flex-grow-1 p-4 p-md-5 overflow-auto w-100">
            
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <a href="lista.html" class="btn btn-sm btn-outline-secondary d-flex align-items-center">
                        <i class="fa-solid fa-arrow-left me-2"></i> Voltar
                    </a>
                    <h2 class="m-0 fw-bold text-primary d-flex align-items-center">
                        <i class="fa-solid fa-circle-plus me-2"></i> Registar Nova Localização
                    </h2>
                </div>
                <button class="utilizador m-0">Administrador</button>
            </div>

            <div class="card w-100 shadow-sm rounded border-top border-primary border-4" style="max-width: 1200px;">
                <div class="card-body p-4 p-md-5">
                    
                    <form id="formNovaLocalizacao" action="lista.html">
                        
                        <h5 class="text-dark mb-4 border-bottom pb-2">Dados da Instalação</h5>
                        
                        <div class="row g-4 mb-5">
                            <div class="col-md-6">
                                <label class="form-label text-dark">Edifício / Bloco *</label>
                                <input type="text" class="form-control" placeholder="Ex: Edifício Principal" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Piso *</label>
                                <input type="text" class="form-control" placeholder="Ex: Piso 2" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Serviço / Departamento *</label>
                                <input type="text" class="form-control" placeholder="Ex: Cuidados Intensivos (UCI)" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Sala / Gabinete</label>
                                <input type="text" class="form-control" placeholder="Ex: Box 4">
                            </div>
                        </div>

                        <h5 class="text-dark mb-4 border-bottom pb-2 mt-4">Capacidade e Requisitos Técnicos</h5>
                        
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label text-dark">Capacidade Máxima (Equipamentos)</label>
                                <input type="number" class="form-control" placeholder="Ex: 15">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Infraestrutura Disponível</label>
                                <select class="form-select">
                                    <option selected>Tomadas UPS e Ponto de Rede Disponíveis</option>
                                    <option>Apenas Tomadas Normais</option>
                                    <option>Tomadas UPS (Sem Rede)</option>
                                    <option>Sem Requisitos Especiais</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-dark">Observações Adicionais</label>
                                <textarea class="form-control" rows="3" placeholder="Restrições de acesso, notas para a equipa técnica, etc."></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
                            <a href="lista.html" class="btn btn-light border px-4 d-flex align-items-center">
                                <i class="fa-solid fa-xmark me-2"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary px-4 d-flex align-items-center">
                                <i class="fa-solid fa-floppy-disk me-2"></i> Registar Localização
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>

    <script src="../../assets/Bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/1241308.js"></script>
</body>
</html>
