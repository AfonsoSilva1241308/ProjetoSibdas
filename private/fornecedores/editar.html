                    <form id="formEditarFornecedor" action="lista.html">
                        
            <div class="card w-100 shadow-sm rounded border-top border-primary border-4" style="max-width: 1200px;">
                <div class="card-body p-4 p-md-5">
                    <h2 class="mb-4 text-primary"><strong><i class="fa-solid fa-pen-to-square me-2"></i> Atualização de Dados </strong></h2>
                    <p class="text-muted mb-4">A modificar o registo: <strong>Dräger Portugal Lda</strong></p>
                    <hr class="mb-5">
                    <form id="formEditarFornecedor" action="lista.html">
                        
                        <h5 class="fw-bold text-primary mb-4 border-bottom pb-2">1. Dados da Entidade</h5>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label class="form-label fw-medium text-dark">Nome da Empresa / Marca *</label>
                                <input type="text" class="form-control" value="Dräger Portugal Lda" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-medium text-dark">NIF *</label>
                                <input type="text" class="form-control" value="501234567" required readonly style="background-color: #e9ecef;">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium text-dark">Categoria Principal</label>
                                <select class="form-select">
                                    <option value="1" selected>Fabricante de Equipamentos</option>
                                    <option value="2">Prestador de Manutenção Técnica</option>
                                    <option value="3">Fornecedor de Consumíveis</option>
                                    <option value="4">Distribuidor Multimarca</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium text-dark">Tempo Máx. de Resposta (SLA)</label>
                                <select class="form-select">
                                    <option value="12h" selected>Nível Crítico - Até 12h</option>
                                    <option value="24h">Nível Alto - Até 24h</option>
                                    <option value="48h">Nível Normal - Até 48h</option>
                                    <option value="72h">Nível Baixo - Até 72h</option>
                                </select>
                            </div>
                        </div>

                        <h5 class="fw-bold text-primary mb-4 border-bottom pb-2 mt-5">2. Informações de Contacto</h5>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-medium text-dark">Pessoa de Contacto (Gestor de Conta)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" value="Eng. Carlos Mendes">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium text-dark">Cargo / Departamento</label>
                                <input type="text" class="form-control" value="Key Account Manager Saúde">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium text-dark">Email de Assistência *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="fa-solid fa-envelope text-muted"></i></span>
                                    <input type="email" class="form-control border-start-0 ps-0" value="suporte@draeger.pt" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium text-dark">Telefone / Linha de Apoio *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="fa-solid fa-phone text-muted"></i></span>
                                    <input type="tel" class="form-control border-start-0 ps-0" value="+351 210 000 000" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium text-dark">Observações Adicionais</label>
                            <textarea class="form-control" rows="3">Contrato Full-Risk ativo para os ventiladores da Ala de Cuidados Intensivos. O portal externo de abertura de avarias exige o número de série do equipamento colado no chassis.</textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
                            <a href="lista.html" class="btn btn-light border fw-semibold px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary fw-semibold px-4">
                                <i class="fa-solid fa-floppy-disk me-2"></i>Gravar Alterações
                            </button>
                        </div>
                    </form>
