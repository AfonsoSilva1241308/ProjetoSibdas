<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Fornecedor — MediLink Digital</title>
    
    <link rel="shortcut icon" href="../../assets/img/logo1.png" type="image/png">
    <link rel="stylesheet" href="../../assets/Bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/fontawesome/all.min.css">
    <link rel="stylesheet" href="../../assets/css/1241308.css">
</head>
<body class="bg-light">

    <div class="d-flex vh-100">
        
        <div class="bg-white p-3 d-flex flex-column border-end" style="width: 260px; min-width: 260px;">
            <a href="../dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none justify-content-center mt-2">
                <img src="../../assets/img/logo.png" alt="MediLink Digital" style="max-height: 45px;">
            </a>
            
            <ul class="nav nav-pills flex-column mb-auto gap-2 mt-3">
                <li class="nav-item">
                    <a href="../dashboard.html" class="nav-link text-dark fw-medium px-3">
                        Visão Geral
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../equipamentos/lista.html" class="nav-link text-dark fw-medium px-3">
                        Equipamentos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../localizacoes/lista.html" class="nav-link text-dark fw-medium px-3">
                        Localizações
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../manutencoes/lista.html" class="nav-link text-dark fw-medium px-3">
                        Manutenção
                    </a>
                </li>
                <li class="nav-item">
                    <a href="lista.html" class="nav-link active fw-semibold shadow-sm px-3" aria-current="page">
                        Fornecedores
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../documentacao/lista.html" class="nav-link text-dark fw-medium px-3">
                        Documentação e Contratos
                    </a>
                </li>
            </ul>
            <hr class="text-muted mt-4">
            <div>
                <a href="../../public/index.html" class="btn btn-outline-primary w-100 fw-bold">
                    Sair do Sistema
                </a>
            </div>
        </div>

        <div class="flex-grow-1 p-4 p-md-5 overflow-auto w-100">
            
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <a href="lista.html" class="btn btn-sm btn-outline-secondary d-flex align-items-center">
                        <i class="fa-solid fa-arrow-left me-2"></i> Voltar
                    </a>
                    <h2 class="m-0 fw-bold text-primary d-flex align-items-center">
                        <i class="fa-solid fa-circle-plus me-2"></i> Registar Novo Fornecedor
                    </h2>
                </div>
                <button class="utilizador">Administrador</button>
            </div>

            <div class="card w-100 shadow-sm rounded border-top border-primary border-4" style="max-width: 1200px;">
                <div class="card-body p-4 p-md-5">
                    
                    <form id="formNovoFornecedor" action="lista.html">
                        
                       <h5 class="text-dark mb-4 border-bottom pb-2">Dados da Entidade</h5>
                        
                        <div class="row g-4 mb-5">
                            <div class="col-md-6">
                                <label class="form-label text-dark">Nome da Empresa / Marca *</label>
                                <input type="text" class="form-control" placeholder="Ex: Dräger Portugal Lda" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">NIF *</label>
                                <input type="text" class="form-control" placeholder="Ex: 501234567" maxlength="9" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Tipo de Fornecedor *</label>
                                <select class="form-select" required>
                                    <option value="" disabled selected>Selecione uma opção...</option>
                                    <option value="Fabricante">Fabricante</option>
                                    <option value="Distribuidor">Distribuidor ou fornecedor comercial</option>
                                    <option value="Assistencia">Empresa de assistência técnica</option>
                                    <option value="Consumiveis">Fornecedor de consumíveis ou acessórios</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Contacto Telefónico (Geral) *</label>
                                <input type="tel" class="form-control" placeholder="Ex: +351 210 123 456" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Email da Empresa *</label>
                                <input type="email" class="form-control" placeholder="Ex: geral@empresa.pt" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Website</label>
                                <input type="url" class="form-control" placeholder="Ex: https://www.empresa.com">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-dark">Morada *</label>
                                <input type="text" class="form-control" placeholder="Ex: Rua Direita, nº 10, Porto" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-dark">Observações</label>
                                <textarea class="form-control" rows="3" placeholder="Notas internas, restrições ou informações sobre contratos..."></textarea>
                            </div>
                        </div>

                        <h5 class="text-dark mb-4 border-bottom pb-2 mt-4">Pessoa de Contacto</h5>
                        
                        <div class="row g-4 mb-4">
                            <div class="col-md-4">
                                <label class="form-label text-dark">Nome do Contacto *</label>
                                <input type="text" class="form-control" placeholder="Ex: Eng. Carlos Mendes" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-dark">Telefone Pessoal*</label>
                                <input type="tel" class="form-control" placeholder="Ex: +351 912 345 678" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-dark">Email Pessoal *</label>
                                <input type="email" class="form-control" placeholder="Ex: carlos.mendes@empresa.pt" required>
                            </div>
                        </div>

                       <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
                            <button type="reset" class="btn btn-outline-secondary px-4 fw-medium">
                              <i class="fa-solid fa-eraser me-1"></i> Limpar
                            </button>
                            <button type="submit" class="btn btn-primary px-5 fw-bold">
                              <i class="fa-regular fa-floppy-disk me-1"></i> Guardar Registo
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>

    <script src="../../assets/Bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/1241308.js"></script>
</body>
</html>
