<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Fornecedor — MediLink Digital</title>
    
    <link rel="shortcut icon" href="../../assets/img/logo1.png" type="image/png">
    <link rel="stylesheet" href="../../assets/Bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/fontawesome/all.min.css">
    <link rel="stylesheet" href="../../assets/css/1241308.css">
</head>
<body class="bg-light">

    <div class="d-flex vh-100">
        
        <div class="bg-white p-3 d-flex flex-column border-end" style="width: 260px; min-width: 260px;">
            <a href="../dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none justify-content-center mt-2">
                <img src="../../assets/img/logo.png" alt="MediLink Digital" style="max-height: 45px;">
            </a>
            
            <ul class="nav nav-pills flex-column mb-auto gap-2 mt-3">
                <li class="nav-item">
                    <a href="../dashboard.html" class="nav-link text-dark fw-medium px-3">
                        Visão Geral
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../equipamentos/lista.html" class="nav-link text-dark fw-medium px-3">
                        Equipamentos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../localizacoes/lista.html" class="nav-link text-dark fw-medium px-3">
                        Localizações
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../manutencoes/lista.html" class="nav-link text-dark fw-medium px-3">
                        Manutenção
                    </a>
                </li>
                <li class="nav-item">
                    <a href="lista.html" class="nav-link active fw-semibold shadow-sm px-3" aria-current="page">
                        Fornecedores
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../documentacao/lista.html" class="nav-link text-dark fw-medium px-3">
                        Documentação e Contratos
                    </a>
                </li>
            </ul>
            <hr class="text-muted mt-4">
            <div>
                <a href="../../public/index.html" class="btn btn-outline-primary w-100 fw-bold">
                    Sair do Sistema
                </a>
            </div>
        </div>

        <div class="flex-grow-1 p-4 p-md-5 overflow-auto w-100">
            
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <a href="lista.html" class="btn btn-sm btn-outline-secondary d-flex align-items-center">
                        <i class="fa-solid fa-arrow-left me-2"></i> Voltar
                    </a>
                    <h2 class="m-0 fw-bold text-primary d-flex align-items-center">
                        <i class="fa-solid fa-circle-plus me-2"></i> Registar Novo Fornecedor
                    </h2>
                </div>
                <button class="utilizador">Administrador</button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    
                    <form id="formNovoFornecedor" action="lista.html">
                        
                        <h5 class="text-dark mb-4 border-bottom pb-2">Dados da Entidade</h5>
                        
                        <div class="row g-4 mb-5">
                            <div class="col-md-6">
                                <label class="form-label text-dark">Nome da Empresa / Marca *</label>
                                <input type="text" class="form-control" placeholder="Ex: Philips Healthcare Portugal" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">NIF *</label>
                                <input type="text" class="form-control" placeholder="Ex: 501234567" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Categoria Principal</label>
                                <select class="form-select">
                                    <option selected disabled>Selecione...</option>
                                    <option value="1">Fabricante de Equipamentos</option>
                                    <option value="2">Prestador de Manutenção Técnica</option>
                                    <option value="3">Fornecedor de Consumíveis</option>
                                    <option value="4">Distribuidor Multimarca</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Tempo Máx. de Resposta (SLA)</label>
                                <select class="form-select">
                                    <option value="12h">Nível Crítico - Até 12h</option>
                                    <option value="24h" selected>Nível Alto - Até 24h</option>
                                    <option value="48h">Nível Normal - Até 48h</option>
                                    <option value="72h">Nível Baixo - Até 72h</option>
                                </select>
                            </div>
                        </div>

                        <h5 class="text-dark mb-4 border-bottom pb-2 mt-4">Informações de Contacto</h5>
                        
                        <div class="row g-4 mb-5">
                            <div class="col-md-6">
                                <label class="form-label text-dark">Pessoa de Contacto (Gestor de Conta)</label>
                                <input type="text" class="form-control" placeholder="Ex: Carlos Mendes">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Cargo / Departamento</label>
                                <input type="text" class="form-control" placeholder="Ex: Key Account Manager Saúde">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Email de Assistência *</label>
                                <input type="email" class="form-control" placeholder="Ex: suporte@empresa.pt" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark">Telefone / Linha de Apoio *</label>
                                <input type="tel" class="form-control" placeholder="Ex: +351 210 000 000" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
                            <button type="reset" class="btn btn-outline-secondary px-4 fw-medium">
                              <i class="fa-solid fa-eraser me-1"></i> Limpar
                            </button>
                            <button type="submit" class="btn btn-primary px-5 fw-bold">
                              <i class="fa-regular fa-floppy-disk me-1"></i> Guardar Registo
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>

    <script src="../../assets/Bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/1241308.js"></script>
</body>
</html>
